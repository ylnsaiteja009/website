<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>

<body>

    <center>
        <h1>Login</h1>
    </center>

    <center>
        <form action="./sweets.html">

            <label for="username"></label>
            <br>

            <input type="email"
                   id="username"
                   placeholder="Username or Email"
                   required>

            <br><br>

            <label for="password"></label>

            <br>

            <input type="password"
                   id="password"
                   placeholder="Enter Password"
                   required>

            <br><br><br>

            <input type="submit" value="Login">

        </form>
    </center>

</body>

</html>
